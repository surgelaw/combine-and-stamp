name: PDFCombineStamp
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    macOS: "13.0"
  
settings:
  MARKETING_VERSION: "1.1.0"
  CURRENT_PROJECT_VERSION: "1"
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  SWIFT_VERSION: "5.0"

targets:
  PDFCombineStamp:
    type: application
    platform: macOS
    sources:
      # Main app files
      - BatesStampApp.swift
      - BatesStampView.swift
      - ContentView.swift
      # Shared PDF manager
      - SharedPDFManager.swift
      # v1.1 files
      - FileItem.swift
      - FileValidator.swift
      - DropZoneView.swift
      - FileListView.swift
      - FileRowView.swift
      - ReorderableFileListView.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.PDFCombineStamp
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      INFOPLIST_KEY_CFBundleDisplayName: "PDF Combine & Stamp"
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
      INFOPLIST_KEY_LSMinimumSystemVersion: "13.0"
    dependencies:
      - target: PDFCombineStampExtension
        embed: true
        
  PDFCombineStampExtension:
    type: app-extension
    platform: macOS
    sources:
      # Extension files
      - PDFCombineStampExtensionShareViewController.swift
      - PDFCombineStampExtensionExtensionView.swift
      # Shared PDF manager
      - SharedPDFManager.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.PDFCombineStamp.Extension
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
      SKIP_INSTALL: NO
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Combine PDFs and Stamp"
      INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.services

schemes:
  PDFCombineStamp:
    build:
      targets:
        PDFCombineStamp: all
    run:
      config: Debug

name: PDFCombineStamp
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  
settings:
  MARKETING_VERSION: "1.1.0"
  CURRENT_PROJECT_VERSION: "1"
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  SWIFT_VERSION: "5.0"

targets:
  PDFCombineStamp:
    type: application
    platform: macOS
    sources:
      - path: PDFCombineStamp
        excludes:
          - "*.entitlements"
      - path: Shared
      # New v1.1 files
      - FileItem.swift
      - FileValidator.swift
      - DropZoneView.swift
      - FileListView.swift
      - FileRowView_FINAL.swift
      - ReorderableFileListView_Fixed.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.PDFCombineStamp
      INFOPLIST_FILE: PDFCombineStamp/Info.plist
      CODE_SIGN_ENTITLEMENTS: PDFCombineStamp/PDFCombineStamp.entitlements
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: PDFCombineStamp/PDFCombineStamp.entitlements
    dependencies:
      - target: PDFCombineStampExtension
        embed: true
        
  PDFCombineStampExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: PDFCombineStampExtension
        excludes:
          - "*.entitlements"
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.PDFCombineStamp.Extension
      INFOPLIST_FILE: PDFCombineStampExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: PDFCombineStampExtension/PDFCombineStampExtension.entitlements
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
      SKIP_INSTALL: NO
    entitlements:
      path: PDFCombineStampExtension/PDFCombineStampExtension.entitlements

schemes:
  PDFCombineStamp:
    build:
      targets:
        PDFCombineStamp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
